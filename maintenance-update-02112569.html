<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขณะนี้ระบบปิดปรับปรุงชั่วคราว</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Kanit', sans-serif;
      background: #f5f7f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 48px 52px 44px;
      max-width: 520px;
      width: 90%;
      text-align: center;
    }

    .logo-wrap {
      margin-bottom: 32px;
    }

    /* SVG Logo recreated from the uploaded image */
    .logo-wrap svg {
      width: 120px;
      height: auto;
    }

    .icon-wrap {
      margin-bottom: 20px;
    }
    .icon-wrap svg {
      width: 56px;
      height: 56px;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #1a4a2e;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #c07080;
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .message {
      font-size: 17px;
      color: #444;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .highlight {
      display: inline-block;
      background: #f0faf4;
      border: 1.5px solid #2d8a56;
      border-radius: 8px;
      padding: 12px 20px;
      margin: 14px 0 18px;
      font-size: 14px;
      color: #1a5c37;
      font-weight: 700;
      line-height: 1.7;
    }

    .sorry {
      font-size: 16px;
      color: #888;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="https://sam.or.th/site/sam/wp-content/uploads/2020/04/sam-2020-04-23_06-17-50_023838.png" alt="SAM Logo" style="width:140px; height:auto;">
    </div>

    <h1>ขณะนี้ระบบปิดปรับปรุงชั่วคราว</h1>
    <div class="divider"></div>

    <p class="message">เพื่อพัฒนาประสิทธิภาพการให้บริการ</p>

    <div class="highlight">
      📅 วันที่ 4 พฤศจิกายน 2569 </br> เวลา 21.30 - 23.00 น.
    </div>

    <p class="message">กรุณากลับมาทำรายการใหม่อีกครั้งในภายหลัง</p>

    <p class="sorry">ขออภัยในความไม่สะดวกมา ณ ที่นี้</p>

  </div>
</body>
</html>
