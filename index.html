<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8F8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>SAM Social AMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --splash-top: #F7F8F8;
      --splash-bottom: #E2EAE3;
      --primary-filled: #0E5D30;
      --primary-hover: #3F855D;
      --primary-text: #0F6635;
      --text: #12151C;
      --dimmed: #586A8A;
      --error-text: #D01111;
      --white: #FFFFFF;
      --radius-s: 6px;
      --control-height: 40px;
      --tap-target: 48px;
      --font: "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: linear-gradient(180deg, var(--splash-top) 0%, var(--splash-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .container {
      text-align: center;
      padding: 48px 24px;
      max-width: 360px;
      width: 100%;
      margin: 16px;
    }

    .logo {
      width: 200px;
      margin: 0 auto 40px;
    }

    .logo img {
      width: 100%;
      height: auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--dimmed);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .spinner-wrap {
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #d0dcd4;
      border-top: 3px solid var(--primary-filled);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .countdown {
      font-size: 14px;
      color: var(--dimmed);
    }

    .fallback {
      display: none;
      margin-top: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--tap-target);
      padding: 0 32px;
      background: var(--primary-filled);
      color: var(--white);
      border-radius: var(--radius-s);
      text-decoration: none;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 12px;
      transition: background 0.2s;
    }

    .btn:active { background: var(--primary-hover); }

    .btn-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--tap-target);
      padding: 0 32px;
      background: transparent;
      color: var(--primary-text);
      border: 2px solid var(--primary-text);
      border-radius: var(--radius-s);
      text-decoration: none;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      width: 100%;
    }

    .btn-outline:active { opacity: 0.75; }
  </style>
</head>

  <h1>กำลังเปิดแอปพลิเคชัน</h1>
  <p class="subtitle">
    หากแอปไม่เปิดขึ้นเอง กดปุ่มด้านล่าง<br>
    If the app does not open, tap below.
  </p>

  <div id="loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>
    <p class="countdown" id="countdown">กำลังเปิดแอป...</p>
  </div>

  <div class="fallback" id="fallback">
    <a class="btn" id="retry-btn" href="#">Open SAM+ Application</a>
    <a class="btn-outline" id="store-btn" href="#">Download SAM+ Application</a>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const source = params.get('source') || '';
  const contractId = params.get('contract_id') || '';
  const action = params.get('action') || '';

  const deeplinkParams = [];
  if (source)     deeplinkParams.push('source='      + encodeURIComponent(source));
  if (contractId) deeplinkParams.push('contract_id=' + encodeURIComponent(contractId));
  if (action)     deeplinkParams.push('action='      + encodeURIComponent(action));

  const deeplink = 'samapp://home' + (deeplinkParams.length ? '?' + deeplinkParams.join('&') : '');

  let storeURL = 'https://mobile.sam.or.th/app-download/';
  if (deeplinkParams.length) storeURL += '?' + deeplinkParams.join('&');

  document.getElementById('store-btn').href = storeURL;
  document.getElementById('retry-btn').href = deeplink;

  window.location.href = deeplink;

  let appOpened = false;
  let secondsLeft = 3;
  const countdownEl = document.getElementById('countdown');

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') appOpened = true;
  });

  const timer = setInterval(() => {
    secondsLeft--;
    if (secondsLeft > 0) {
      countdownEl.textContent = 'กำลังเปิดแอป... (' + secondsLeft + ')';
    } else {
      clearInterval(timer);
      if (!appOpened) {
        window.location.href = storeURL;
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }
    }
  }, 1000);
</script>
